services:
  postgres:
    image: postgres:16
    container_name: osb-chatbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: osb_chatbot
      POSTGRES_USER: osb_user
      POSTGRES_PASSWORD: osb_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
